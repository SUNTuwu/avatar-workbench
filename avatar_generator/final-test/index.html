<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>期末前的近况 · 连续动作测试</title>
<style>
  html, body, iframe { margin: 0; width: 100%; height: 100%; border: 0; display: block; }
</style>
<iframe title="虚拟形象生成器"></iframe>
<script>
  const editor = document.querySelector('iframe');
  editor.onload = async () => {
    const win = editor.contentWindow;
    const doc = editor.contentDocument;
    const caption = doc.createElement('div');
    caption.style.cssText = 'min-height:1.6em;text-align:center;font-size:18px;font-weight:600';
    doc.querySelector('#transport').before(caption);
    try {
      const response = await fetch('project.json');
      if (!response.ok) throw new Error('工程读取失败');
      const project = await response.json();
      win.loadProject(project);
      doc.querySelector('#inDur').value = project.duration;
      doc.querySelector('#inSpan').value = project.duration;
      const clock = doc.querySelector('#timeText');
      function syncCaption() {
        const t = parseFloat(clock.textContent);
        const cue = project.captions.find(c => c.start <= t && t < c.end);
        const line = cue ? cue.text : '';
        if (caption.textContent !== line) caption.textContent = line;
      }
      new MutationObserver(syncCaption).observe(clock, { childList: true });
      syncCaption();
    } catch (err) {
      caption.textContent = '载入动作测试失败：' + err.message;
    }
  };
  editor.src = '../';
</script>
</html>
