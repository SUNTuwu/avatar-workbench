<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>透明 GIF 导出工具</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#141719;color:#e5eae9;font:15px/1.5 "Segoe UI",sans-serif}main{max-width:1160px;margin:auto;padding:24px}header,.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between;margin-bottom:20px}h1{font-size:26px;margin:0}h2{font-size:17px;margin:0 0 14px}section,aside{background:#202528;border:1px solid #364043;border-radius:10px;padding:18px}article{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px}aside{align-self:start}fieldset{border:0;margin:0;padding:0}hr{border:0;border-top:1px solid #394245;margin:20px 0}button,.pick,a{font:inherit;color:inherit;background:#323b3f;padding:6px 12px;border-radius:5px;border:1px solid #596568;cursor:pointer;text-decoration:none}.primary,.pick{background:#256556;border-color:#419483;color:white}button:disabled,input:disabled{opacity:.45;cursor:default}input[type=number]{width:84px;background:#15191c;color:inherit;border:1px solid #536065;border-radius:4px;padding:6px}label{display:inline-grid;gap:4px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}canvas{display:block;max-width:100%;max-height:58vh;touch-action:none;cursor:crosshair;background:repeating-conic-gradient(#333b3f 0 25%,#293034 0 50%) 0/20px 20px}.stage{min-height:240px;background:#181c1f;display:grid;place-items:center;margin-bottom:12px}.stage canvas{width:auto;height:auto}#scrub{flex:1;min-width:80px}p,output{color:#b8c9c5}small{display:block;margin:8px 0;color:#b8c9c5}.pick:focus-within{outline:2px solid white}.pick input{position:absolute;opacity:0;width:1px;height:1px}a[hidden]{display:none}@media(max-width:760px){article{grid-template-columns:1fr}main{padding:14px}}
</style>
<main><header><h1>透明 GIF 导出工具</h1><label class="pick">选择 PNG 序列文件夹<input id="folder" type="file" webkitdirectory multiple></label></header>
<article><section><h2 id="source">帧预览</h2><div class="stage"><canvas id="view" width="1" height="1" aria-label="帧预览，拖动框选裁剪区域"></canvas></div>
<div class="row"><button id="play" disabled>播放</button><input id="scrub" aria-label="预览帧" type="range" min="0" max="0" value="0" disabled><output id="frame">—</output></div></section>
<aside><fieldset id="edit" disabled><h2>剪辑区间</h2><div class="fields"><label>起始帧<input id="first" type="number"></label><label>结束帧（含）<input id="last" type="number"></label><label>帧率 FPS<input id="fps" type="number" min="1" max="50" value="30"></label></div><output id="duration"></output>
<hr><h2>画布裁剪</h2><small>在预览上拖出裁剪框，或输入像素值。</small><div class="fields"><label>左 X<input id="x" type="number"></label><label>上 Y<input id="y" type="number"></label><label>宽<input id="w" type="number"></label><label>高<input id="h" type="number"></label></div><div class="row"><button id="auto">按选段去透明边</button><button id="reset">完整画布</button></div><hr><label><span><input type="checkbox" id="matchColor" checked> 套用 FINAL 截图校色</span></label><small>已在工作台套用此模板的序列，请取消勾选。</small><button id="encode" class="primary">生成循环 GIF</button></fieldset>
<p id="status" role="status">请选择包含编号 PNG 的文件夹。</p><button id="cancel" hidden>取消</button> <a id="download" hidden>下载 GIF</a></aside></article></main><script src="../grade.js"></script><script type="module" src="editor.js"></script></html>
